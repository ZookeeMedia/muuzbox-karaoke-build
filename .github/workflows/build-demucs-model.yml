name: Build Demucs.cpp Model

# Converts the official Demucs htdemucs_v4 PyTorch weights to the
# ggml format demucs.cpp consumes. The output is a single ~84 MB
# file that's IDENTICAL across all platforms — model is data, not
# code — so we run this once, not per-OS.
#
# Triggered manually. The model rarely needs rebuilding (only when
# Demucs upstream ships new weights, which happens ~yearly).
#
# This workflow uses Python + PyTorch, so it's slow (cold start ~10
# min, total ~20 min). The binary build workflow is the one we'll
# trigger more often.

on:
  workflow_dispatch:
    inputs:
      bundle_version:
        description: 'Bundle version tag (must match the binary release)'
        required: true
        default: 'demucs-cli-v0.1.0'
      demucs_cpp_ref:
        description: 'demucs.cpp ref — the convert.py we use comes from here'
        required: true
        default: 'main'
      # Phase 1 ships the default htdemucs 4-stem (vocals / drums / bass / other).
      # The fine-tuned variant (htdemucs_ft) is 4 separate models that the
      # convert script processes one at a time — adding ~4x the runtime
      # and a separate file per stem. We'd switch to that only if quality
      # complaints come back from venues.

env:
  DEMUCS_CPP_REPO: sevagh/demucs.cpp

jobs:
  build-model:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout demucs.cpp
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DEMUCS_CPP_REPO }}
          ref:        ${{ github.event.inputs.demucs_cpp_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install conversion deps
        run: |
          python -m pip install --upgrade pip
          # Install Demucs (which transitively pulls PyTorch) and the
          # numpy/torch versions demucs.cpp's convert.py expects.
          # Pinning torch to a CPU build keeps the runner small.
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          python -m pip install demucs numpy
          # Whatever convert.py needs from demucs.cpp itself (usually
          # nothing beyond the above).
          if [ -f scripts/convert-pth-to-ggml.py ]; then
            echo "convert script: scripts/convert-pth-to-ggml.py"
          elif [ -f convert.py ]; then
            echo "convert script: convert.py"
          else
            echo "::warning::Could not locate a known convert.py. Inspect the repo and adjust this step."
            find . -name '*.py' | xargs grep -l 'convert' | head -10
          fi

      - name: Download Demucs PyTorch weights
        run: |
          set -e
          # convert-pth-to-ggml.py hardcodes the expected checkpoint
          # filename as HT_HUB_PATH = "955717e8-8726e21a.th" and reads it
          # from torch.hub.get_dir()/checkpoints/. Newer Demucs versions
          # have moved the file or rename it on download, so calling
          # demucs.get_model() doesn't reliably put the right file in
          # the right place.
          #
          # Bypass: fetch the exact file from Facebook's CDN to the path
          # the script expects. URL pattern from facebookresearch/demucs
          # model registry. If Facebook ever takes this URL down, the
          # fallback is to pin demucs<X.Y to whichever version still uses
          # this hash.
          CKPT_DIR="$HOME/.cache/torch/hub/checkpoints"
          mkdir -p "$CKPT_DIR"
          curl -fL --retry 3 \
            -o "$CKPT_DIR/955717e8-8726e21a.th" \
            "https://dl.fbaipublicfiles.com/demucs/hybrid_transformer/955717e8-8726e21a.th"
          ls -lah "$CKPT_DIR"

      - name: Verify checkpoint pre-conversion
        run: |
          set -e
          CKPT="$HOME/.cache/torch/hub/checkpoints/955717e8-8726e21a.th"
          echo "Checking $CKPT"
          ls -lah "$CKPT" || (echo "::error::Checkpoint missing"; exit 1)
          SIZE=$(wc -c < "$CKPT")
          echo "Size: $SIZE bytes"
          if [ "$SIZE" -lt 80000000 ]; then
            echo "::error::Checkpoint too small (got $SIZE, expected ~84 MB) — curl likely got HTML/error page"
            file "$CKPT"
            head -c 500 "$CKPT" | od -c | head -20
            exit 1
          fi
          # The torch.load test is the real one — proves the file is a
          # valid pickle the convert script can read.
          # weights_only=False is required: PyTorch 2.6 flipped the
          # default to True, which refuses to unpickle non-tensor
          # globals — and the htdemucs checkpoint contains a reference
          # to demucs.htdemucs.HTDemucs.
          python -c "
          import torch, sys
          try:
              with open('$CKPT', 'rb') as f:
                  data = torch.load(f, map_location='cpu', weights_only=False)
              print('torch.load OK. Top-level keys:', list(data.keys())[:10])
          except Exception as e:
              print('torch.load FAILED:', repr(e))
              sys.exit(1)
          "

      - name: Run conversion
        run: |
          set -e
          mkdir -p out
          # demucs.cpp's convert-pth-to-ggml.py takes a single positional
          # dest_dir. With no flags, it reads htdemucs weights from the
          # torch hub cache (pre-staged by the Download step) and writes
          # `ggml-model-htdemucs-4s-f16.bin` into dest_dir.
          #
          # Patch out the bare `except Exception:` that swallows the real
          # error message — replace with one that re-raises so CI logs
          # show the actual failure.
          SCRIPT=""
          if   [ -f scripts/convert-pth-to-ggml.py ]; then SCRIPT=scripts/convert-pth-to-ggml.py
          elif [ -f convert.py ];                    then SCRIPT=convert.py
          else
            echo "::error::No convert script found. Manual intervention needed — see docs/karaoke-build-pipeline.md."
            exit 1
          fi
          # Patch (1): PyTorch 2.6+ defaults torch.load weights_only=True,
          # which refuses to unpickle non-tensor globals — demucs
          # checkpoints contain a demucs.htdemucs.HTDemucs class ref.
          # Force weights_only=False so the load succeeds.
          sed -i 's/torch\.load(fp, map_location="cpu")/torch.load(fp, map_location="cpu", weights_only=False)/g' "$SCRIPT"

          # Patch (2): un-swallow the bare `except Exception:` — turn it
          # into `except Exception as _e:` and print repr + traceback so
          # if anything else breaks we see the real cause.
          sed -i 's/except Exception:/except Exception as _e:/' "$SCRIPT"
          sed -i '/Error: failed to load PyTorch model file/a\        print("Underlying:", repr(_e)); import traceback; traceback.print_exc()' "$SCRIPT"

          echo "----- Patched script (relevant lines) -----"
          grep -n 'torch\.load\|except Exception\|Underlying' "$SCRIPT" || true
          echo "-----"
          python "$SCRIPT" out
          ls -lah out/

      - name: Normalise output filename
        run: |
          set -e
          mkdir -p staged
          # convert-pth-to-ggml.py writes ggml-model-htdemucs-4s-f16.bin
          # (~80 MB — fp16 quantised from the 252 MB PyTorch fp32 weights).
          # The Electron app expects htdemucs.bin (matches PATHS.modelPath()
          # in karaokeInstaller.js). Rename here so release asset and
          # installer agree without further translation.
          # 50 MB floor is a sanity check — a truncated file would be
          # much smaller; a valid one is ~80 MB.
          BIN=$(find out -name 'ggml-model-htdemucs-*.bin' -size +50M | head -1)
          if [ -z "$BIN" ]; then
            # Fallback: any .bin >50MB. Defensive against upstream renames.
            BIN=$(find out -name '*.bin' -size +50M | head -1)
          fi
          if [ -z "$BIN" ]; then
            echo "::error::No .bin >50MB produced — conversion likely failed."
            ls -la out/
            exit 1
          fi
          cp "$BIN" staged/htdemucs.bin
          ls -lah staged/

      - name: Compute SHA-256
        id: hash
        run: |
          HASH=$(shasum -a 256 staged/htdemucs.bin | awk '{print $1}')
          SIZE=$(wc -c < staged/htdemucs.bin)
          echo "sha256=$HASH" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE"   >> "$GITHUB_OUTPUT"
          echo "Model SHA-256: $HASH"
          echo "Model size:    $SIZE bytes"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-htdemucs
          path: staged/htdemucs.bin

      - name: Attach to existing release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:    ${{ github.event.inputs.bundle_version }}
          append_body: true
          body: |

            ## Model

            * **model**: `htdemucs` (4-stem: vocals / drums / bass / other)
            * **filename**: `htdemucs.bin`
            * **sha256**: `${{ steps.hash.outputs.sha256 }}`
            * **size**: ${{ steps.hash.outputs.size }} bytes
          files: |
            staged/htdemucs.bin
